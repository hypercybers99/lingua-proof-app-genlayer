<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sealTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5555" />
      <stop offset="50%" stop-color="#0D6E6E" />
      <stop offset="100%" stop-color="#149191" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F0" />
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base / Drop Shadow -->
  <circle cx="256" cy="256" r="236" fill="url(#sealTealGrad)" filter="url(#sealShadow)" />

  <!-- Serrated Notary Edge (Points) -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="6,4" opacity="0.8" />
  <circle cx="256" cy="256" r="218" fill="#0D6E6E" stroke="url(#brassGrad)" stroke-width="4" />

  <!-- Outer Ring Text Track -->
  <path id="textCircleTop" d="M 64,256 A 192,192 0 1,1 448,256" fill="none" />
  <path id="textCircleBottom" d="M 448,256 A 192,192 0 0,1 64,256" fill="none" />

  <text font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FDE68A" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      LINGUAPROOF NOTARY &#x2022; STUDIONET
    </textPath>
  </text>
  <text font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FDE68A" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      &#x2605; TRANSLATION FIDELITY &#x2605;
    </textPath>
  </text>

  <!-- Inner Seal Circle -->
  <circle cx="256" cy="256" r="158" fill="#FBFBFA" stroke="#D97706" stroke-width="3" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0D6E6E" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Center Motif: Notary Balance of Fidelity & Dual Parchment Scrolls -->
  <!-- Left Scroll: Source Text -->
  <g transform="translate(170, 180)">
    <rect x="0" y="0" width="56" height="74" rx="4" fill="url(#parchmentGrad)" stroke="#0D6E6E" stroke-width="2.5" />
    <line x1="10" y1="16" x2="46" y2="16" stroke="#0D6E6E" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="28" x2="46" y2="28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="40" x2="38" y2="40" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="52" x2="42" y2="52" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Right Scroll: Target Text -->
  <g transform="translate(286, 180)">
    <rect x="0" y="0" width="56" height="74" rx="4" fill="url(#parchmentGrad)" stroke="#0D6E6E" stroke-width="2.5" />
    <line x1="10" y1="16" x2="46" y2="16" stroke="#0D6E6E" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="28" x2="46" y2="28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="40" x2="38" y2="40" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="52" x2="42" y2="52" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Center Balance Pillar & Notary Beam -->
  <g transform="translate(256, 170)">
    <!-- Central Beam -->
    <path d="M -54,20 L 54,20" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="20" r="5" fill="#B45309" />
    <!-- Vertical Pillar -->
    <line x1="0" y1="20" x2="0" y2="90" stroke="#0D6E6E" stroke-width="4" stroke-linecap="round" />
    <!-- Base Pedestal -->
    <path d="M -24,90 L 24,90" stroke="#0D6E6E" stroke-width="4" stroke-linecap="round" />
    <path d="M -16,96 L 16,96" stroke="#0D6E6E" stroke-width="3" stroke-linecap="round" />
    <!-- Left Balance Link -->
    <line x1="-50" y1="20" x2="-50" y2="34" stroke="#D97706" stroke-width="2" stroke-dasharray="2,2" />
    <!-- Right Balance Link -->
    <line x1="50" y1="20" x2="50" y2="34" stroke="#D97706" stroke-width="2" stroke-dasharray="2,2" />
  </g>

  <!-- Diagonal Feather Quill Across Base -->
  <g transform="translate(256, 275) rotate(-35)">
    <!-- Quill Shaft -->
    <path d="M -55,0 Q 0,-6 65,0" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
    <!-- Feather Vane -->
    <path d="M -45,-1 Q -20,-18 35,-4 Q 0,-3 -45,-1 Z" fill="#FDE68A" stroke="#D97706" stroke-width="1.5" />
    <!-- Nib -->
    <polygon points="-55,0 -64,0 -58,3" fill="#92400E" />
  </g>

  <!-- Notary Wax Ribbon & Verification Seal -->
  <g transform="translate(256, 320)">
    <!-- Ribbon tails -->
    <path d="M -20,10 L -28,36 L -12,30 L -2,38 L -8,12 Z" fill="#92400E" />
    <path d="M 20,10 L 28,36 L 12,30 L 2,38 L 8,12 Z" fill="#92400E" />
    <!-- Wax wafer -->
    <circle cx="0" cy="8" r="22" fill="#D97706" stroke="#B45309" stroke-width="2" />
    <circle cx="0" cy="8" r="18" fill="#F59E0B" />
    <!-- Notary Monogram / Seal Glyph -->
    <path d="M -7,8 L -2,13 L 8,3" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
